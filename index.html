<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evergreen Survey Status - Authentication</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 280px; }
        input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #008751; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .error { color: red; font-size: 0.8rem; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Survey Status Access</h3>
        <input type="password" id="pwInput" placeholder="Enter Password">
        <button onclick="verifyPassword()">Access System</button>
        <div id="errMsg" class="error">Invalid password. Please try again.</div>
    </div>

    <script>
        async function hashPassword(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyPassword() {
            const input = document.getElementById("pwInput").value;
            const errMsg = document.getElementById("errMsg");
            
            if (!input) return;

            try {
                const inputHash = await hashPassword(input);
                const res = await fetch("pw.json");
                const data = await res.json();

                if (data.valid_hashes.includes(inputHash)) {
                    sessionStorage.setItem("authenticated", "true");
                    // Redirect to secret status page
                    window.location.href = "ss_master.html";
                } else {
                    errMsg.style.display = "block";
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        }
    </script>
</body>
</html>
